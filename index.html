<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pago de juguete</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--accent:#1a73e8;--ok:#1e9e4a;--shadow:0 4px 16px rgba(0,0,0,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#222633;--text:#f1f3f8;--muted:#9aa3b5;--accent:#6ea8ff;--ok:#4cd07d;--shadow:0 4px 16px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#14161c;--card:#222633;--text:#f1f3f8;--muted:#9aa3b5;--accent:#6ea8ff;--ok:#4cd07d;--shadow:0 4px 16px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:420px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:18px;min-height:100%}
h1{font-size:1.3rem;margin:4px 0;text-align:center}
.card{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(135deg, #ff9800, #ff0000);box-shadow:var(--shadow);min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.card b{font-size:1.1rem;letter-spacing:.15em}
.card small{opacity:.9}
.box{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid transparent;background:var(--bg);color:var(--text);border-radius:16px;padding:10px 14px;font-size:1rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent)}
.amount{font-size:2.6rem;font-weight:700;text-align:center;margin:6px 0}
.pay{border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:1.3rem;font-weight:700;padding:18px;width:100%;cursor:pointer}
.pay:active{transform:scale(.98)}
#tap,#done{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
.pulse{width:120px;height:120px;border-radius:50%;background:var(--accent);opacity:.9;display:grid;place-items:center;font-size:3rem;animation:p 1s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(26,115,232,.5)}100%{box-shadow:0 0 0 40px rgba(26,115,232,0)}}
.check{width:120px;height:120px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:4rem}
.sm{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div id="main">
    <h1>💳 Tarxeta de ANXO</h1>
    <div class="card" style="margin-top:14px"><b>•••• •••• 2304 2024</b><div><small style="font-weight:700">ANXO QUINTÁS RODRIGUEZ</small></div></div>
    <div class="box" style="margin-top:18px">
      <div class="chips" id="chips"></div>
      <div class="amount" id="amount">0,00 €</div>
      <button class="pay" id="payBtn">Pagar</button>
    </div>
    <p class="sm" style="text-align:center">Escolle que queres mercar.</p>
  </div>
  <div id="tap"><div class="pulse">📶</div><h2>Acerca o móvil ao datáfono</h2></div>
  <div id="done"><div class="check">✓</div><h2>¡Pago realizado!</h2><div class="amount" id="paid"></div><button class="pay" id="again">Jugar otra vez</button></div>
</div>
<script>
var items=[["🍦 Xeado",2],["🥖 Pan",1],["🧸 Xoguete",5],["⚽ Pelota",8]];
var sel=items[0],ctx=null;
var $=function(i){return document.getElementById(i)};
function fmt(n){return n.toFixed(2).replace(".",",")+" €"}
function show(id){["main","tap","done"].forEach(function(x){$(x).style.display=x===id?(x==="main"?"block":"flex"):"none"})}
items.forEach(function(it){var b=document.createElement("button");b.className="chip";b.textContent=it[0];b.onclick=function(){sel=it;draw()};b.dataset.n=it[0];$("chips").appendChild(b)});
function draw(){$("amount").textContent=fmt(sel[1]);document.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",c.dataset.n===sel[0])})}
function beep(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();[[1000,0],[1500,.13]].forEach(function(f){var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f[0];o.connect(g);g.connect(ctx.destination);var t=ctx.currentTime+f[1];g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.12)})}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
$("payBtn").onclick=function(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}show("tap");setTimeout(function(){beep();$("paid").textContent=fmt(sel[1]);show("done")},1500)};
$("again").onclick=function(){show("main")};
draw();show("main");
</script>
</body>
</html>
